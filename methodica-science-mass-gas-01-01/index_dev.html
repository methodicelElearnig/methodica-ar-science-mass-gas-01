<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>DEV — נפח של גז · חלק 01</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: monospace; }

    #dev-bar {
      position: fixed; top: 0; left: 0; right: 0; height: 44px;
      background: #f9ca24; color: #1a1a2e;
      display: flex; align-items: center; gap: 10px;
      padding: 0 12px; z-index: 9999; font-size: 13px; font-weight: 700;
      direction: ltr;
    }
    #dev-bar span { background: #1a1a2e; color: #f9ca24; padding: 2px 8px; border-radius: 4px; }
    #dev-bar button {
      height: 28px; padding: 0 12px; border: none; border-radius: 4px;
      background: #1a1a2e; color: #f9ca24; font-weight: 700; cursor: pointer; font-size: 13px;
    }
    #dev-bar button:hover { background: #333; }
    #dev-bar input[type=number] {
      width: 54px; height: 28px; border: none; border-radius: 4px;
      text-align: center; font-size: 14px; font-weight: 700;
    }
    #dev-label { margin-left: 6px; }
    #dev-bar select {
      height: 28px; border: none; border-radius: 4px; padding: 0 6px;
      background: #1a1a2e; color: #f9ca24; font-weight: 700; font-size: 13px; cursor: pointer;
    }

    #lomda-frame {
      position: fixed; top: 44px; left: 0; right: 0; bottom: 0;
      border: none; width: 100%; height: calc(100% - 44px);
    }
  </style>
</head>
<body>

<div id="dev-bar">
  <span>DEV</span>
  <select id="part-select" onchange="goPart(this.value)" title="מעבר בין רכיבי היחידה">
    <option value="01">רכיב 01</option>
    <option value="02">רכיב 02</option>
    <option value="03">רכיב 03</option>
    <option value="04">רכיב 04</option>
    <option value="05">רכיב 05</option>
    <option value="06">רכיב 06</option>
  </select>
  <button onclick="nav(+1)" title="קדימה (RTL: שמאל = קדימה)">◀</button>
  <span id="dev-label">S 0 / ?</span>
  <button onclick="nav(-1)" title="אחורה (RTL: ימין = אחורה)">▶</button>
  <input type="number" id="jump-input" min="0" value="0" onkeydown="if(event.key==='Enter')jumpTo()">
  <button onclick="jumpTo()">Go</button>
  <button onclick="resetUnit()" title="מוחק תשובות, בחירת דמות והתקדמות שנשמרו — מתחיל את היחידה מההתחלה">איפוס</button>
  <span style="margin-right:auto; font-size:11px; font-weight:400;">Ctrl+← קדימה &nbsp;|&nbsp; Ctrl+→ אחורה</span>
</div>

<iframe id="lomda-frame" src="index.html"></iframe>

<script>
  let cur = 0;
  let total = 1;

  const frame  = document.getElementById('lomda-frame');
  const label  = document.getElementById('dev-label');
  const input  = document.getElementById('jump-input');
  const partSel = document.getElementById('part-select');

  /* Part switcher: each part is its own folder (…-01 … -06) with its own index_dev.html. */
  const PART_RE = /methodica-science-mass-gas-01-(\d\d)\//;
  const thisPart = (PART_RE.exec(location.pathname) || [])[1] || '01';
  partSel.value = thisPart;
  function goPart(n) {
    location.href = location.pathname.replace(PART_RE, 'methodica-science-mass-gas-01-' + n + '/');
  }
  /* The lomda can cross into another part inside the frame — keep the selector in sync. */
  frame.addEventListener('load', () => {
    try {
      const m = PART_RE.exec(frame.contentWindow.location.pathname);
      if (m) partSel.value = m[1];
    } catch (e) {}
  });

  window.addEventListener('message', e => {
    if (e.data?.type === 'DEV_READY') {
      total = e.data.total;
      updateLabel();
    }
  });

  function send(n) {
    frame.contentWindow.postMessage({ type: 'DEV_GOTO', screen: n }, '*');
    cur = n;
    input.value = n;
    updateLabel();
  }

  function nav(delta) {
    const next = Math.max(0, Math.min(total - 1, cur + delta));
    send(next);
  }

  /* Clears everything the unit persisted (answers, character, nav stack) and reloads from screen 0. */
  function resetUnit() {
    const P = 'methodica-science-mass-gas-01:';
    frame.onload = () => {   // unload first: the lomda re-saves its state on pagehide
      frame.onload = null;
      [sessionStorage, localStorage].forEach(s => Object.keys(s).filter(k => k.startsWith(P)).forEach(k => s.removeItem(k)));
      frame.src = 'index.html'; cur = 0; input.value = 0; updateLabel();
    };
    frame.src = 'about:blank';
  }

  function jumpTo() {
    const n = parseInt(input.value, 10);
    if (!isNaN(n) && n >= 0 && n < total) send(n);
  }

  function updateLabel() {
    label.textContent = 'S ' + cur + ' / ' + (total - 1);
  }

  document.addEventListener('keydown', e => {
    if (e.ctrlKey && e.key === 'ArrowLeft')  nav(+1);
    if (e.ctrlKey && e.key === 'ArrowRight') nav(-1);
  });
</script>
</body>
</html>
